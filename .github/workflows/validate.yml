name: Validate Claude Code Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Plugin Manifests (JSON)
        run: |
          node -e '
            const fs = require("fs");
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            console.log("✓ .claude-plugin/plugin.json is valid JSON");
            if (!plugin.name || !plugin.version || !plugin.description) {
              throw new Error("Missing required fields in plugin.json");
            }
            console.log(`Plugin name: ${plugin.name}, version: ${plugin.version}`);

            const marketplace = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            console.log("✓ .claude-plugin/marketplace.json is valid JSON");
            if (!marketplace.name || !marketplace.plugins || marketplace.plugins.length === 0) {
              throw new Error("Invalid marketplace.json schema");
            }
            console.log(`Marketplace: ${marketplace.name}, plugins registered: ${marketplace.plugins.length}`);
          '

      - name: Verify Commands and Skills Exist
        run: |
          echo "Verifying slash commands..."
          for cmd in commands/*.md; do
            [ -f "$cmd" ] && echo "✓ Command found: $cmd"
          done

          echo "Verifying agent skills..."
          for skill in skills/*/SKILL.md; do
            [ -f "$skill" ] && echo "✓ Skill found: $skill"
          done
